# Generated by scripts/build.py from data/schema.json. Do not edit by hand.
name: "Propose a model entry"
description: "Propose a model for the XUrbanAI Models registry. Every field follows the published standard."
title: "Model entry: "
labels: ["models", "entry-proposal"]
body:
  - type: markdown
    attributes:
      value: "Proposals are reviewed against the [models standard](https://xurbanai.com/standards.html#models). Fill every field. Answers such as \"to follow\" or \"TBD\" block a release; if something is not known yet, say what is missing and why."
  - type: input
    id: entry_title
    attributes:
      label: "Title"
      description: "Name of the model as it should appear in the registry."
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: "Summary"
      description: "One sentence, up to 280 characters, shown in the registry list."
    validations:
      required: true
  - type: input
    id: authors
    attributes:
      label: "Authors"
      description: "Names, separated by commas."
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: "Links"
      description: "One per line: a label, then the URL. Include the code, data or weights, and any paper."
      placeholder: "Code — https://github.com/...\nPaper — https://arxiv.org/abs/..."
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: "Licence"
      description: "Licence of the released artifacts, e.g. MIT, Apache-2.0, CC BY 4.0."
    validations:
      required: true
  - type: textarea
    id: citation
    attributes:
      label: "Citation"
      description: "How the entry should be cited."
    validations:
      required: true
  - type: textarea
    id: urban_question
    attributes:
      label: "Urban question"
      description: "The city problem the work addresses, and who is meant to use the result."
    validations:
      required: true
  - type: textarea
    id: intended_task
    attributes:
      label: "Intended task"
      description: "The prediction, representation, or generation task, and the urban decision it is meant to inform."
    validations:
      required: true
  - type: textarea
    id: inputs_modalities
    attributes:
      label: "Inputs & modalities"
      description: "Imagery, maps, mobility traces, text, tabular records, or sensor streams, with resolution and preprocessing."
    validations:
      required: true
  - type: textarea
    id: data_provenance
    attributes:
      label: "Training data"
      description: "Sources, geography, time span, licence, sampling, and any data that was excluded and why."
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: "Evaluation"
      description: "Held-out tasks, metrics, baselines, and uncertainty estimates, with the evaluation code released."
    validations:
      required: true
  - type: textarea
    id: failure_modes
    attributes:
      label: "Failure modes"
      description: "Observed errors, subgroup gaps, distribution shifts, and conditions under which outputs should not be used."
    validations:
      required: true
  - type: textarea
    id: geographic_validity
    attributes:
      label: "Geographic validity"
      description: "Cities trained and tested on, and evidence for or against transfer to other places."
    validations:
      required: true
  - type: textarea
    id: usage_constraints
    attributes:
      label: "Usage constraints"
      description: "Intended users, prohibited uses, and requirements for human review."
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: "I have the right to release everything linked above, and restricted data is described rather than redistributed."
          required: true
        - label: "The released artifacts reproduce the results reported in this proposal."
          required: true
