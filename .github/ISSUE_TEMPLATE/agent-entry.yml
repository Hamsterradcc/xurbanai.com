# Generated by scripts/build.py from data/schema.json. Do not edit by hand.
name: "Propose a agent entry"
description: "Propose a agent for the XUrbanAI Agents registry. Every field follows the published standard."
title: "Agent entry: "
labels: ["agents", "entry-proposal"]
body:
  - type: markdown
    attributes:
      value: "Proposals are reviewed against the [agents standard](https://xurbanai.com/standards.html#agents). Fill every field. Answers such as \"to follow\" or \"TBD\" block a release; if something is not known yet, say what is missing and why."
  - type: input
    id: entry_title
    attributes:
      label: "Title"
      description: "Name of the agent as it should appear in the registry."
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: "Summary"
      description: "One sentence, up to 280 characters, shown in the registry list."
    validations:
      required: true
  - type: input
    id: authors
    attributes:
      label: "Authors"
      description: "Names, separated by commas."
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: "Links"
      description: "One per line: a label, then the URL. Include the code, data or weights, and any paper."
      placeholder: "Code — https://github.com/...\nPaper — https://arxiv.org/abs/..."
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: "Licence"
      description: "Licence of the released artifacts, e.g. MIT, Apache-2.0, CC BY 4.0."
    validations:
      required: true
  - type: textarea
    id: citation
    attributes:
      label: "Citation"
      description: "How the entry should be cited."
    validations:
      required: true
  - type: textarea
    id: urban_question
    attributes:
      label: "Urban question"
      description: "The city problem the work addresses, and who is meant to use the result."
    validations:
      required: true
  - type: textarea
    id: task_workflow
    attributes:
      label: "Task & workflow"
      description: "The research or planning task, the steps the agent performs, and where the workflow starts and stops."
    validations:
      required: true
  - type: textarea
    id: data_provenance
    attributes:
      label: "Tools & data access"
      description: "Models, datasets, APIs, and documents the agent can call or read, with their licences."
    validations:
      required: true
  - type: textarea
    id: decision_boundaries
    attributes:
      label: "Decision boundaries"
      description: "What the agent may decide alone, what requires a human, and how its outputs are reviewed."
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: "Evaluation protocol"
      description: "Success criteria, reliability across runs, comparison with human performance, and reproducibility."
    validations:
      required: true
  - type: textarea
    id: failure_modes
    attributes:
      label: "Failure modes"
      description: "Observed errors, fabrication risks, bias in retrieved evidence, and misuse scenarios."
    validations:
      required: true
  - type: textarea
    id: traceability
    attributes:
      label: "Traceability"
      description: "Logs, intermediate outputs, and citations the agent produces so that results can be audited."
    validations:
      required: true
  - type: textarea
    id: geographic_validity
    attributes:
      label: "Geographic validity"
      description: "Cities tested, and whether claims are local or supported by cross-city evidence."
    validations:
      required: true
  - type: textarea
    id: usage_constraints
    attributes:
      label: "Usage constraints"
      description: "Intended users, settings where the agent must not be used, and cost or rate considerations."
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: "I have the right to release everything linked above, and restricted data is described rather than redistributed."
          required: true
        - label: "The released artifacts reproduce the results reported in this proposal."
          required: true
