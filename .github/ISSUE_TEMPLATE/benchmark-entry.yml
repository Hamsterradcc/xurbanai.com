# Generated by scripts/build.py from data/schema.json. Do not edit by hand.
name: "Propose a benchmark entry"
description: "Propose a benchmark for the XUrbanAI Benchmarks registry. Every field follows the published standard."
title: "Benchmark entry: "
labels: ["benchmarks", "entry-proposal"]
body:
  - type: markdown
    attributes:
      value: "Proposals are reviewed against the [benchmarks standard](https://xurbanai.com/standards.html#benchmarks). Fill every field. Answers such as \"to follow\" or \"TBD\" block a release; if something is not known yet, say what is missing and why."
  - type: input
    id: entry_title
    attributes:
      label: "Title"
      description: "Name of the benchmark as it should appear in the registry."
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: "Summary"
      description: "One sentence, up to 280 characters, shown in the registry list."
    validations:
      required: true
  - type: input
    id: authors
    attributes:
      label: "Authors"
      description: "Names, separated by commas."
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: "Links"
      description: "One per line: a label, then the URL. Include the code, data or weights, and any paper."
      placeholder: "Code — https://github.com/...\nPaper — https://arxiv.org/abs/..."
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: "Licence"
      description: "Licence of the released artifacts, e.g. MIT, Apache-2.0, CC BY 4.0."
    validations:
      required: true
  - type: textarea
    id: citation
    attributes:
      label: "Citation"
      description: "How the entry should be cited."
    validations:
      required: true
  - type: textarea
    id: urban_question
    attributes:
      label: "Research question"
      description: "The urban capability the task measures, and why that capability matters for a decision."
    validations:
      required: true
  - type: textarea
    id: task_definition
    attributes:
      label: "Task definition"
      description: "Inputs, expected outputs, and the exact instructions or prompts given to a system under test."
    validations:
      required: true
  - type: textarea
    id: data_provenance
    attributes:
      label: "Data"
      description: "Source, geography, time span, licence, splits, and how test data is protected from leakage."
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: "Metrics & criteria"
      description: "Scoring rules, what counts as success, and how uncertainty or disagreement is reported."
    validations:
      required: true
  - type: textarea
    id: baselines
    attributes:
      label: "Baselines"
      description: "Reference systems, including simple and human baselines where they exist, with their scores."
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: "Task validation"
      description: "How the task itself was checked: annotation agreement, leakage tests, and whether scores track the capability it claims to measure."
    validations:
      required: true
  - type: textarea
    id: failure_modes
    attributes:
      label: "Known limitations"
      description: "Ways the benchmark can be gamed or misread, and capabilities it does not measure."
    validations:
      required: true
  - type: textarea
    id: geographic_validity
    attributes:
      label: "Generalization protocol"
      description: "How performance is tested across cities, periods, or populations beyond the development data."
    validations:
      required: true
  - type: textarea
    id: submission_rules
    attributes:
      label: "Submission rules"
      description: "How results are submitted, what must be disclosed, and how evaluation code is run."
    validations:
      required: true
  - type: textarea
    id: versioning_errata
    attributes:
      label: "Versioning & errata"
      description: "Version history, corrections to data or scoring, and how earlier results are handled."
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: "I have the right to release everything linked above, and restricted data is described rather than redistributed."
          required: true
        - label: "The released artifacts reproduce the results reported in this proposal."
          required: true
